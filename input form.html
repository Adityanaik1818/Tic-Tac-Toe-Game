<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML Form Project</title>
</head>
<body>

<h2>Complete HTML Input Types Form</h2>

<form action="#" method="post">

    <!-- Text Inputs -->
    Name:<br>
    <input type="text" placeholder="Enter name"><br><br>

    Password:<br>
    <input type="password" placeholder="Enter password"><br><br>

    Email:<br>
    <input type="email" placeholder="Enter email"><br><br>

    Phone:<br>
    <input type="tel" placeholder="Enter phone number"><br><br>

    Website:<br>
    <input type="url" placeholder="Enter website URL"><br><br>

    Search:<br>
    <input type="search" placeholder="Search here"><br><br>

    Age:<br>
    <input type="number" placeholder="Enter age"><br><br>

    <!-- Date & Time -->
    Date of Birth:<br>
    <input type="date"><br><br>

    Time:<br>
    <input type="time"><br><br>

    Date & Time (Local):<br>
    <input type="datetime-local"><br><br>

    Month:<br>
    <input type="month"><br><br>

    Week:<br>
    <input type="week"><br><br>

    <!-- Obsolete (Exam Purpose) -->
    Datetime (Obsolete):<br>
    <input type="datetime"><br><br>

    <!-- Radio Buttons -->
    Gender:<br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female<br><br>

    <!-- Checkbox -->
    Hobbies:<br>
    <input type="checkbox"> Reading
    <input type="checkbox"> Sports
    <input type="checkbox"> Music<br><br>

    <!-- Range & Color -->
    Skill Level:<br>
    <input type="range" min="0" max="100"><br><br>

    Favorite Color:<br>
    <input type="color"><br><br>

    <!-- File & Image -->
    Upload File:<br>
    <input type="file"><br><br>

    Image Button:<br>
    <input type="image" src="button.png" alt="Submit Image"><br><br>

    <!-- Hidden -->
    <input type="hidden" value="FORM2026">

    <!-- Buttons -->
    <input type="button" value="Normal Button"><br><br>

    <input type="submit" value="Submit Form">
    <input type="reset" value="Reset Form">

</form>

</body>
</html>
