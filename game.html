<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 10px;
            margin: 20px auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            background-color: #f9f9f9;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
        }

        .cell.X {
            color: green;
        }

        .cell.O {
            color: red;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <div class="board">
            <div class="cell" id="cell0" onclick="makeMove(0)">1</div>
            <div class="cell" id="cell1" onclick="makeMove(1)">2</div>
            <div class="cell" id="cell2" onclick="makeMove(2)">3</div>
            <div class="cell" id="cell3" onclick="makeMove(3)">4</div>
            <div class="cell" id="cell4" onclick="makeMove(4)">5</div>
            <div class="cell" id="cell5" onclick="makeMove(5)">6</div>
            <div class="cell" id="cell6" onclick="makeMove(6)">7</div>
            <div class="cell" id="cell7" onclick="makeMove(7)">8</div>
            <div class="cell" id="cell8" onclick="makeMove(8)">9</div>
        </div>
        <button onclick="restartGame()">Restart</button>
        <div id="message"></div>
    </div>

    <script>
        var currentPlayer = 'X';
        var gameBoard = ['', '', '', '', '', '', '', '', ''];
        var gameOver = false;

        function makeMove(index) {
            if (gameBoard[index] === '' && !gameOver) {
                gameBoard[index] = currentPlayer;
                document.getElementById('cell' + index).textContent = currentPlayer;
                document.getElementById('cell' + index).classList.add(currentPlayer);
                checkWinner();
                currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
            }
        }

        function checkWinner() {
            var winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
                [0, 4, 8], [2, 4, 6]             // Diagonals
            ];

            for (var combo of winningCombinations) {
                var [a, b, c] = combo;
                if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
                    document.getElementById('message').textContent = `${gameBoard[a]} wins! 🎉 Thank you for playing the game 🎉🎉🍾🍾🎊🎊`;
                    gameOver = true;
                    return;
                }
            }

            if (!gameBoard.includes('')) {
                document.getElementById('message').textContent = "It's a draw! 🤝 Thank you for playing the game! Please restart the game and continue playing. 🎉🎉🍾🍾🎊🎊";
                gameOver = true;
            }
        }

        function restartGame() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            gameOver = false;
            currentPlayer = 'X';

            for (var i = 0; i < 9; i++) {
                var cell = document.getElementById('cell' + i);
                cell.textContent = i + 1;
                cell.classList.remove('X', 'O');
            }

            document.getElementById('message').textContent = '';
        }
    </script>
</body>
</html>
