<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional CSS Doraemon</title>
  <style>
    /* =========================================
       CSS ARCHITECTURE & VARIABLES
       ========================================= */
    :root {
      /* Base Colors */
      --dora-blue: #01A4E9;
      --dora-white: #F4F6F7; /* Slightly off-white for realism */
      --dora-red: #E10224;
      --dora-yellow: #FFD400;
      --dora-black: #2C3E50;
      
      /* 3D Lighting Gradients */
      --light-blue: radial-gradient(circle at 35% 25%, #4ac3ff 0%, var(--dora-blue) 60%, #0175a6 100%);
      --light-white: radial-gradient(circle at 35% 25%, #ffffff 0%, var(--dora-white) 70%, #d5d8dc 100%);
      --light-red: radial-gradient(circle at 35% 25%, #ff6b80 0%, var(--dora-red) 50%, #9e0119 100%);
      --light-yellow: radial-gradient(circle at 35% 25%, #ffe666 0%, var(--dora-yellow) 60%, #ccaa00 100%);
      
      /* Structural Variables */
      --stroke: 0.25em solid var(--dora-black);
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #EAF2F8;
    }

    /* Canvas scales everything seamlessly based on viewport size */
    .canvas {
      font-size: 1.2vmin; 
      width: 45em;
      height: 60em;
      position: relative;
    }

    /* =========================================
       HEAD & FACE (Z-index 10)
       ========================================= */
    .head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 34em; /* Wider than it is tall */
      height: 31em;
      background: var(--light-blue);
      border-radius: 47% 47% 45% 45%;
      border: var(--stroke);
      box-shadow: 0 1.5em 2em rgba(0,0,0,0.2);
      z-index: 10;
    }

    .face {
      position: absolute;
      bottom: -0.1em;
      left: 50%;
      transform: translateX(-50%);
      width: 27em;
      height: 22em;
      background: var(--light-white);
      border-radius: 48% 48% 45% 45%;
      border: var(--stroke);
    }

    /* =========================================
       FACIAL FEATURES
       ========================================= */
    .eyes {
      position: absolute;
      top: 3.5em;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: -0.25em; /* Forces overlap */
      z-index: 12;
    }

    .eye {
      width: 8em;
      height: 9.5em;
      background: var(--dora-white);
      border-radius: 50%;
      border: var(--stroke);
      position: relative;
    }

    .pupil {
      position: absolute;
      top: 4.5em;
      width: 1.8em;
      height: 2.2em;
      background: var(--dora-black);
      border-radius: 50%;
    }
    .eye.left .pupil { right: 1.5em; } /* Pushed inward */
    .eye.right .pupil { left: 1.5em; } /* Pushed inward */

    /* Eye Catchlight (White reflection) */
    .pupil::after {
      content: '';
      position: absolute;
      top: 0.4em;
      left: 0.3em;
      width: 0.6em;
      height: 0.6em;
      background: white;
      border-radius: 50%;
    }

    .nose {
      position: absolute;
      top: 12em;
      left: 50%;
      transform: translateX(-50%);
      width: 4em;
      height: 4em;
      background: var(--light-red);
      border-radius: 50%;
      border: var(--stroke);
      z-index: 13;
      box-shadow: 0 0.5em 1em rgba(0,0,0,0.2);
    }
    
    .nose::after {
      content: '';
      position: absolute;
      top: 0.8em;
      left: 1em;
      width: 1em;
      height: 1em;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
    }

    .mouth-line {
      position: absolute;
      top: 16em;
      left: 50%;
      transform: translateX(-50%);
      width: 0.25em;
      height: 8em;
      background: var(--dora-black);
      z-index: 11;
    }

    .smile {
      position: absolute;
      top: 11em;
      left: 50%;
      transform: translateX(-50%);
      width: 22em;
      height: 13em;
      border-bottom: var(--stroke);
      border-radius: 0 0 50% 50%;
      z-index: 10;
    }

    .whiskers {
      position: absolute;
      top: 14em;
      width: 8em;
      height: 6em;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 11;
    }
    .whiskers.left { left: 2em; }
    .whiskers.right { right: 2em; }
    
    .whisker {
      width: 100%;
      height: 0.25em;
      background: var(--dora-black);
      border-radius: 1em;
    }
    .whiskers.left .top { transform: rotate(15deg); }
    .whiskers.left .bot { transform: rotate(-15deg); }
    .whiskers.right .top { transform: rotate(-15deg); }
    .whiskers.right .bot { transform: rotate(15deg); }

    /* =========================================
       COLLAR & BODY
       ========================================= */
    .collar {
      position: absolute;
      top: 29.5em;
      left: 50%;
      transform: translateX(-50%);
      width: 24em;
      height: 2.5em;
      background: var(--light-red);
      border: var(--stroke);
      border-radius: 2em;
      z-index: 15;
      box-shadow: 0 0.8em 1em rgba(0,0,0,0.3);
    }

    .bell {
      position: absolute;
      top: 1em;
      left: 50%;
      transform: translateX(-50%);
      width: 5.5em;
      height: 5.5em;
      background: var(--light-yellow);
      border: var(--stroke);
      border-radius: 50%;
      z-index: 16;
      box-shadow: 0 0.5em 1em rgba(0,0,0,0.3);
    }

    .bell-line {
      position: absolute;
      top: 1.5em;
      left: -0.25em;
      width: calc(100% + 0.5em);
      height: 0.25em;
      background: var(--dora-black);
    }
    .bell-line::after {
      content: '';
      position: absolute;
      top: 0.6em;
      left: 0;
      width: 100%;
      height: 0.25em;
      background: var(--dora-black);
    }
    .bell-hole {
      position: absolute;
      top: 3em;
      left: 50%;
      transform: translateX(-50%);
      width: 1em;
      height: 1em;
      background: var(--dora-black);
      border-radius: 50%;
    }
    .bell-hole::after {
      content: '';
      position: absolute;
      top: 0.5em;
      left: 50%;
      transform: translateX(-50%);
      width: 0.25em;
      height: 2em;
      background: var(--dora-black);
    }

    .body {
      position: absolute;
      top: 29em;
      left: 50%;
      transform: translateX(-50%);
      width: 24em;
      height: 23em;
      background: var(--light-blue);
      border: var(--stroke);
      border-radius: 40% 40% 35% 35%;
      z-index: 5;
    }

    .stomach {
      position: absolute;
      bottom: 2em;
      left: 50%;
      transform: translateX(-50%);
      width: 18em;
      height: 17em;
      background: var(--light-white);
      border: var(--stroke);
      border-radius: 50%;
    }

    .pocket {
      position: absolute;
      bottom: 2em;
      left: 50%;
      transform: translateX(-50%);
      width: 13em;
      height: 6.5em;
      background: var(--light-white);
      border: var(--stroke);
      border-radius: 0 0 13em 13em;
    }
    .pocket::before {
      content: '';
      position: absolute;
      top: -0.25em;
      left: -0.25em;
      width: calc(100% + 0.5em);
      height: 0.25em;
      background: var(--dora-black);
    }

    /* =========================================
       LIMBS
       ========================================= */
    .arms {
      position: absolute;
      top: 31em;
      width: 100%;
      height: 10em;
      z-index: 4; 
    }

    .arm {
      position: absolute;
      width: 7em;
      height: 12em;
      background: var(--light-blue);
      border: var(--stroke);
      border-radius: 4em;
    }
    .arm.left {
      left: 5.5em;
      transform: rotate(35deg);
    }
    .arm.right {
      right: 5.5em;
      transform: rotate(-35deg);
    }

    .hand {
      position: absolute;
      bottom: -3em;
      left: 50%;
      transform: translateX(-50%);
      width: 7.5em;
      height: 7.5em;
      background: var(--light-white);
      border: var(--stroke);
      border-radius: 50%;
      box-shadow: 0 0.5em 1em rgba(0,0,0,0.2);
    }

    .legs {
      position: absolute;
      top: 50em;
      left: 50%;
      transform: translateX(-50%);
      width: 15em;
      height: 5em;
      z-index: 4;
    }

    .crotch-gap {
      position: absolute;
      top: -1.5em;
      left: 50%;
      transform: translateX(-50%);
      width: 4em;
      height: 4em;
      background: #EAF2F8; /* Matches body background */
      border-top: var(--stroke);
      border-radius: 50%;
      z-index: 6;
    }

    .foot {
      position: absolute;
      top: 1.5em;
      width: 13em;
      height: 6em;
      background: var(--light-white);
      border: var(--stroke);
      border-radius: 45% 45% 35% 35% / 55% 55% 45% 45%;
      z-index: 7;
      box-shadow: 0 2em 2em rgba(0,0,0,0.15);
    }
    .foot.left { left: -9.5em; }
    .foot.right { right: -9.5em; }

  </style>
</head>
<body>
  <div class="canvas">
    
    <div class="head">
      <div class="face"></div>
      
      <div class="eyes">
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
      </div>
      
      <div class="nose"></div>
      <div class="mouth-line"></div>
      <div class="smile"></div>
      
      <div class="whiskers left">
        <div class="whisker top"></div>
        <div class="whisker mid"></div>
        <div class="whisker bot"></div>
      </div>
      <div class="whiskers right">
        <div class="whisker top"></div>
        <div class="whisker mid"></div>
        <div class="whisker bot"></div>
      </div>
    </div>

    <div class="collar">
      <div class="bell">
        <div class="bell-line"></div>
        <div class="bell-hole"></div>
      </div>
    </div>

    <div class="arms">
      <div class="arm left"><div class="hand"></div></div>
      <div class="arm right"><div class="hand"></div></div>
    </div>

    <div class="body">
      <div class="stomach">
        <div class="pocket"></div>
      </div>
    </div>

    <div class="legs">
      <div class="crotch-gap"></div>
      <div class="foot left"></div>
      <div class="foot right"></div>
    </div>

  </div>
</body>
</html>
