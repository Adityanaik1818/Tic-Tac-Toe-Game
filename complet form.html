<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* 🌈 Background & Base Styling */
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 15px;
      color: #2d3436;
    }

    /* 🧾 Form Container */
    form {
      background-color: #ffffff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      padding: 30px 35px;
      width: 400px;
      animation: fadeIn 0.6s ease;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    form:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    /* 🏷️ Heading */
    h2 {
      text-align: center;
      color: #6c5ce7;
      margin-bottom: 25px;
      font-size: 24px;
    }

    /* ✍️ Labels */
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #2d3436;
    }

    /* 🔤 Input Fields */
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="date"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid #dcdde1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #6c5ce7;
      box-shadow: 0 0 8px rgba(108, 92, 231, 0.3);
    }

    /* 📦 Fieldset */
    fieldset {
      border: 2px solid #dfe6e9;
      border-radius: 10px;
      padding: 10px 15px;
      margin-bottom: 20px;
      background: #f8f9fa;
    }

    legend {
      font-weight: 600;
      color: #0984e3;
    }

    /* 🚀 Submit Button */
    input[type="submit"] {
      width: 100%;
      background: linear-gradient(90deg, #6c5ce7, #00cec9);
      color: white;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    input[type="submit"]:hover {
      background: linear-gradient(90deg, #00cec9, #6c5ce7);
      transform: scale(1.03);
      box-shadow: 0 5px 20px rgba(108, 92, 231, 0.4);
    }

    /* 🎇 Success Popup */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: white;
      color: #2d3436;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .popup h3 {
      color: #00b894;
      margin-bottom: 10px;
    }

    /* ✨ Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 📱 Responsive */
    @media (max-width: 600px) {
      form {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <!-- 🧾 Single Combined Form -->
  <form id="registrationForm">
    <h2>Registration Form</h2>

    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="fname" placeholder="Enter first name" required>

    <label for="lname">Last Name:</label>
    <input type="text" id="lname" name="lname" placeholder="Enter last name" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Password" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Email" required>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required>

    <fieldset>
      <legend>Class</legend>
      <input type="radio" id="classIX" value="Class IX" name="class" required>
      <label for="classIX">Class IX</label><br>
      <input type="radio" id="classX" value="Class X" name="class">
      <label for="classX">Class X</label><br>
    </fieldset>

    <input type="submit" value="Submit">
  </form>

  <!-- 🌟 Popup Message -->
  <div class="popup" id="popup">
    <h3>✅ Form Submitted!</h3>
    <p>Your registration details have been successfully sent.</p>
  </div>

  <!-- 💫 JavaScript -->
  <script>
    const form = document.getElementById("registrationForm");
    const popup = document.getElementById("popup");

    form.addEventListener("submit", function(e) {
      e.preventDefault(); // prevent reload
      popup.classList.add("show");

      // hide popup after 2.5 seconds
      setTimeout(() => {
        popup.classList.remove("show");
        form.reset();
      }, 2500);
    });
  </script>
</body>
</html>
