<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Input Types</title>
</head>
<body>

<h2>HTML Input Types Example</h2>

<!-- Basic Inputs -->
<input type="text" placeholder="Text"><br><br>
<input type="password" placeholder="Password"><br><br>
<input type="email" placeholder="Email"><br><br>
<input type="number" placeholder="Number"><br><br>
<input type="search" placeholder="Search"><br><br>
<input type="tel" placeholder="Phone number"><br><br>
<input type="url" placeholder="Website URL"><br><br>

<!-- Date & Time Inputs -->
<input type="date"><br><br>
<input type="time"><br><br>
<input type="datetime-local"><br><br>
<input type="month"><br><br>
<input type="week"><br><br>

<!-- Buttons -->
<input type="button" value="Click Me"><br><br>
<input type="submit" value="Submit"><br><br>
<input type="reset" value="Reset"><br><br>

<!-- Radio Buttons -->
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female<br><br>

<!-- Checkbox -->
<input type="checkbox"> I agree<br><br>

<!-- File & Image -->
<input type="file"><br><br>
<input type="image" src="button.png" alt="Image Button"><br><br>

<!-- Range & Color -->
<input type="range" min="0" max="100"><br><br>
<input type="color"><br><br>

<!-- Hidden Input -->
<input type="hidden" value="12345">

<!-- Obsolete (Exam Purpose) -->
<input type="datetime"> <!-- obsolete -->

</body>
</html>
