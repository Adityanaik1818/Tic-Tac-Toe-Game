<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Test</title>
    <style>
      /* General Page Styling */
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #74b9ff, #a29bfe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px;
        color: #2d3436;
      }

      /* Form Container */
      form {
        background-color: #ffffff;
        border-radius: 15px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        padding: 25px 30px;
        width: 350px;
        margin: 20px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      /* Hover Effect */
      form:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.2);
      }

      /* Headings (if you add any) */
      h2 {
        text-align: center;
        color: #0984e3;
        margin-bottom: 20px;
      }

      /* Label Styling */
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #2d3436;
      }

      /* Input Fields */
      input[type="text"],
      input[type="password"],
      input[type="email"],
      input[type="date"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 2px solid #dfe6e9;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      /* Focus Effect */
      input:focus {
        border-color: #0984e3;
        box-shadow: 0 0 6px rgba(9, 132, 227, 0.3);
      }

      /* Radio Button Group */
      fieldset {
        border: 2px solid #dfe6e9;
        border-radius: 10px;
        padding: 10px 15px;
        margin-bottom: 20px;
        background: #f8f9fa;
      }

      legend {
        font-weight: 600;
        color: #0984e3;
      }

      /* Submit Button */
      input[type="submit"] {
        width: 100%;
        background-color: #0984e3;
        color: white;
        padding: 12px;
        font-size: 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease, transform 0.1s ease;
      }

      /* Submit Button Hover */
      input[type="submit"]:hover {
        background-color: #74b9ff;
        transform: scale(1.02);
      }

      /* Responsive Design */
      @media (max-width: 600px) {
        body {
          flex-direction: column;
          align-items: center;
        }
        form {
          width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <form action="#" method="post">
      <label for="fname">First name:</label><br />
      <input type="text" id="fname" name="fname" required /><br /><br />
      <label for="lname">Last name:</label><br />
      <input type="text" id="lname" name="lname" required /><br /><br />
      <input type="submit" value="Submit" />
    </form>

    <form action="#" method="post">
      <label for="fname2">First name:</label><br />
      <input
        type="text"
        id="fname2"
        name="fname2"
        placeholder="Type first name"
        required
      /><br /><br />
      <label for="password">Password:</label><br />
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
      /><br /><br />
      <label for="email">Email:</label><br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Email"
        required
      /><br /><br />
      <label for="dob">Date of Birth:</label><br />
      <input type="date" id="dob" name="dob" required /><br /><br />
      <fieldset>
        <legend>Class</legend>
        <input
          type="radio"
          id="classIX"
          value="Class IX"
          name="class"
          required
        />
        <label for="classIX">Class IX</label><br />
        <input type="radio" id="classX" value="Class X" name="class" />
        <label for="classX">Class X</label><br />
      </fieldset>
      <br />
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
